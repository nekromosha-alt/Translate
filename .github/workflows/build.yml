name: Build Live Screen Translator (Windows 11)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate project source files
        shell: pwsh
        run: |
          python generate_project.py

      - name: Install CPU PyTorch and dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Python syntax of generated modules
        shell: pwsh
        run: |
          python -m py_compile src/config.py src/translator.py src/ocr_engine.py src/selector.py src/overlay.py src/ui_window.py src/main.py

      - name: Build Windows executable with PyInstaller (--onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "LiveScreenTranslator" `
            --paths src `
            --collect-all easyocr `
            --collect-all skimage `
            --collect-submodules deep_translator `
            --hidden-import PyQt6.sip `
            --hidden-import PIL.Image `
            --hidden-import scipy.ndimage `
            --hidden-import cv2 `
            --hidden-import mss `
            --hidden-import numpy `
            --hidden-import requests `
            --hidden-import bidi `
            --hidden-import bidi.algorithm `
            --hidden-import pyclipper `
            --hidden-import shapely `
            --hidden-import shapely.geometry `
            src/main.py

      - name: Package dist folder into ZIP archive
        shell: pwsh
        run: |
          Copy-Item README.md dist/LiveScreenTranslator/README.md -Force
          Compress-Archive -Path dist/LiveScreenTranslator -DestinationPath LiveScreenTranslator-win64.zip -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveScreenTranslator-win64
          path: LiveScreenTranslator-win64.zip
          if-no-files-found: error
          retention-days: 30
